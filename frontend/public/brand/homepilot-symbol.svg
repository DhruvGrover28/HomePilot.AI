<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="HomePilot AI Symbol">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Teal/Cyan Brand Accent Gradient -->
    <linearGradient id="hpTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Pilot Core Radiant Gradient -->
    <linearGradient id="hpPilotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Connection Glow Filter -->
    <filter id="hpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base (Midnight Navy Squircle) -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#hpBgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Outer Geometric House Contour -->
  <path d="M 50 16 L 81 38 L 81 77 A 5 5 0 0 1 76 82 L 24 82 A 5 5 0 0 1 19 77 L 19 38 Z"
        stroke="url(#hpTealGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="#0D1527"
        fill-opacity="0.6" />

  <!-- Subtle Apex Beacon Line -->
  <line x1="50" y1="21" x2="50" y2="44" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="2 2" stroke-opacity="0.8" />

  <!-- Interconnected 4-Agent Circuit Grid -->
  <!-- Top Horizontal Link -->
  <line x1="33" y1="46" x2="67" y2="46" stroke="#334155" stroke-width="1.8" />
  <!-- Bottom Horizontal Link -->
  <line x1="33" y1="68" x2="67" y2="68" stroke="#334155" stroke-width="1.8" />
  <!-- Left Vertical Link -->
  <line x1="33" y1="46" x2="33" y2="68" stroke="#334155" stroke-width="1.8" />
  <!-- Right Vertical Link -->
  <line x1="67" y1="46" x2="67" y2="68" stroke="#334155" stroke-width="1.8" />

  <!-- Diagonal Agent-to-Pilot Telemetry Links -->
  <line x1="33" y1="46" x2="50" y2="57" stroke="#0D9488" stroke-width="1.4" stroke-opacity="0.7" />
  <line x1="67" y1="46" x2="50" y2="57" stroke="#0D9488" stroke-width="1.4" stroke-opacity="0.7" />
  <line x1="33" y1="68" x2="50" y2="57" stroke="#0D9488" stroke-width="1.4" stroke-opacity="0.7" />
  <line x1="67" y1="68" x2="50" y2="57" stroke="#0D9488" stroke-width="1.4" stroke-opacity="0.7" />

  <!-- The Four Specialist Agent Nodes -->
  <!-- 1. Energy Specialist (Top-Left) -->
  <circle cx="33" cy="46" r="4.5" fill="#38BDF8" stroke="#0B0F19" stroke-width="1.5" />
  <circle cx="33" cy="46" r="1.8" fill="#FFFFFF" />

  <!-- 2. Water Specialist (Top-Right) -->
  <circle cx="67" cy="46" r="4.5" fill="#22D3EE" stroke="#0B0F19" stroke-width="1.5" />
  <circle cx="67" cy="46" r="1.8" fill="#FFFFFF" />

  <!-- 3. Maintenance Specialist (Bottom-Left) -->
  <circle cx="33" cy="68" r="4.5" fill="#34D399" stroke="#0B0F19" stroke-width="1.5" />
  <circle cx="33" cy="68" r="1.8" fill="#FFFFFF" />

  <!-- 4. Inventory Specialist (Bottom-Right) -->
  <circle cx="67" cy="68" r="4.5" fill="#2DD4BF" stroke="#0B0F19" stroke-width="1.5" />
  <circle cx="67" cy="68" r="1.8" fill="#FFFFFF" />

  <!-- Central Pilot Navigation Diamond (Intelligence Nexus) -->
  <path d="M 50 46 L 54.5 54.5 L 63 57 L 54.5 59.5 L 50 68 L 45.5 59.5 L 37 57 L 45.5 54.5 Z"
        fill="url(#hpPilotGrad)"
        filter="url(#hpGlow)" />
  <circle cx="50" cy="57" r="2" fill="#FFFFFF" />
</svg>
