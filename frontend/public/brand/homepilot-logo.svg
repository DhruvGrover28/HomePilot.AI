<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="100%" height="100%" fill="none" role="img" aria-label="HomePilot AI Logo">
  <defs>
    <!-- Background Gradient for Symbol -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Teal/Cyan Brand Accent Gradient -->
    <linearGradient id="logoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Pilot Core Radiant Gradient -->
    <linearGradient id="logoPilotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <style>
    .hp-brand-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.025em;
      fill: #F8FAFC;
    }
    .hp-brand-ai {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      fill: #0F172A;
    }
  </style>

  <!-- Left Symbol Container (40x40) -->
  <g transform="translate(4, 4)">
    <!-- Container Base -->
    <rect width="40" height="40" rx="10" fill="url(#logoBgGrad)" stroke="#1E293B" stroke-width="1" />

    <!-- Geometric House Contour -->
    <path d="M 20 7 L 33 16 L 33 32 A 2 2 0 0 1 31 34 L 9 34 A 2 2 0 0 1 7 32 L 7 16 Z"
          stroke="url(#logoTealGrad)"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="#0D1527"
          fill-opacity="0.6" />

    <!-- 4 Interconnected Agent Nodes -->
    <circle cx="13" cy="20" r="1.8" fill="#38BDF8" />
    <circle cx="27" cy="20" r="1.8" fill="#22D3EE" />
    <circle cx="13" cy="28" r="1.8" fill="#34D399" />
    <circle cx="27" cy="28" r="1.8" fill="#2DD4BF" />

    <!-- Connection lines -->
    <line x1="13" y1="20" x2="27" y2="20" stroke="#334155" stroke-width="0.8" />
    <line x1="13" y1="28" x2="27" y2="28" stroke="#334155" stroke-width="0.8" />
    <line x1="13" y1="20" x2="13" y2="28" stroke="#334155" stroke-width="0.8" />
    <line x1="27" y1="20" x2="27" y2="28" stroke="#334155" stroke-width="0.8" />

    <!-- Central Pilot Diamond -->
    <path d="M 20 19 L 22.5 23.5 L 26 24 L 22.5 24.5 L 20 29 L 17.5 24.5 L 14 24 L 17.5 23.5 Z"
          fill="url(#logoPilotGrad)" />
    <circle cx="20" cy="24" r="1" fill="#FFFFFF" />
  </g>

  <!-- Typography: HomePilot -->
  <text x="54" y="31" class="hp-brand-text">HomePilot</text>

  <!-- AI Accent Pill Badge -->
  <g transform="translate(162, 14)">
    <rect width="28" height="20" rx="6" fill="#14B8A6" />
    <text x="14" y="14.5" text-anchor="middle" class="hp-brand-ai">AI</text>
  </g>
</svg>
