services:
  # HomePilot FastAPI Backend Web Service
  - type: web
    name: homepilot-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HOMEPILOT_ENV
        value: production
      - key: HOMEPILOT_ALLOW_DEV_FALLBACK
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://homepilot-web.onrender.com,http://localhost:5173"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONITORING_SCHEDULER_ENABLED
        value: "true"

  # HomePilot React / Vite Frontend Static Site
  - type: web
    name: homepilot-web
    runtime: static
    buildCommand: cd frontend && npm install && VITE_API_BASE_URL="https://${API_HOST}" npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: homepilot-api
          property: host
